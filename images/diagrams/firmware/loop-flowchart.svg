<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><style>.t{font:700 48px Arial;fill:#102A43}.s{font:22px Arial;fill:#486581}.b{font:700 20px Arial;fill:#102A43;text-anchor:middle}.sm{font:17px Arial;fill:#334E68;text-anchor:middle}.a{stroke:#5B6B7A;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#5B6B7A"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="70" y="75" class="t">loop() Flowchart</text><text x="70" y="115" class="s">Main customer decision and locker-selection logic</text><rect x="690" y="160" width="420" height="110" rx="18" fill="#ECEFF4" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="198" class="b">Start loop()</text><text x="900.0" y="230" class="sm">Send locker status to NodeMCU</text><rect x="690" y="315" width="420" height="120" rx="18" fill="#4F8EF7" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="353" class="b">Display main menu</text><text x="900.0" y="385" class="sm">1. Leave parcel</text><text x="900.0" y="410" class="sm">2. Take parcel</text><polygon points="900,465.0 1100.0,530 900,595.0 700.0,530" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="537" class="b">Key pressed?</text><polygon points="500,680.0 695.0,745 500,810.0 305.0,745" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="500" y="752" class="b">Key = 1?</text><polygon points="1300,680.0 1495.0,745 1300,810.0 1105.0,745" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="1300" y="752" class="b">Key = 2?</text><rect x="250" y="940" width="500" height="130" rx="18" fill="#8BCF7A" stroke="#AAB8C5" stroke-width="2"/><text x="500.0" y="978" class="b">Check locker availability</text><text x="500.0" y="1010" class="sm">Both full → show no slots</text><text x="500.0" y="1035" class="sm">Otherwise assign ID 1 or 2</text><text x="500.0" y="1060" class="s