<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><style>.t{font:700 48px Arial;fill:#102A43}.s{font:22px Arial;fill:#486581}.b{font:700 20px Arial;fill:#102A43;text-anchor:middle}.sm{font:17px Arial;fill:#334E68;text-anchor:middle}.a{stroke:#5B6B7A;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#5B6B7A"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="70" y="75" class="t">Parcel Collection Flowchart</text><text x="70" y="115" class="s">Function: colle() and repeated fingerprint verification</text><rect x="690" y="145" width="420" height="100" rx="18" fill="#ECEFF4" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="183" class="b">Start collection</text><text x="900.0" y="215" class="sm">Prompt customer to place finger</text><polygon points="900,265.0 1115.0,330 900,395.0 685.0,330" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="337" class="b">Fingerprint recognised?</text><polygon points="900,455.0 1115.0,520 900,585.0 685.0,520" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="527" class="b">Fingerprint ID = 1 or 2?</text><rect x="650" y="690" width="500" height="135" rx="18" fill="#8BCF7A" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="728" class="b">Unlock matching locker</text><text x="900.0" y="760" class="sm">Show access granted</text><text x="900.0" y="785" class="sm">Set selected relay LOW</text><rect x="650" y="870" width="500" height="130" rx="18" fill="#4F8EF7" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="908" class="b">Customer retrieves parcel</text><text x="900.0" y="940" class="sm">Prompt same fingerprint</text><text x="900.0" y="965" class="sm">Wait up to configured delay</text><polygon points="900,1000.0 1125.0,1060 900,1120.0 675.0,1060" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="1067" class="b">Same fingerprint verified?</text><rect x="120" y="995" width="430" height="140" rx="18" fill="#F8B4B4" stroke="#AAB8C5" stroke-width="2"/><text x="335.0" y="1033" class="b">Timeout / failure</text><text x="335.0" y="1065" class="sm">Set relay HIGH</text><text x="335.0" y="1090" class="sm">Set motor LOW</text><text x="335.0" y="1115" class="sm">Return</text><rect x="1250" y="990" width="430" height="145" rx="18" fill="#B89CFF" stroke="#AAB8C5" stroke-width="2"/><text x="1465.0" y="1028" class="b">Lock and reset</text><text x="1465.0" y="1060" class="sm">Set relay HIGH</text><text x="1465.0" y="1085" class="sm">Set motor LOW</text><text x="1465.0" y="1110" class="sm">Send updated locker status</text><path d="M900,245 L900,265" class="a"/><path d="M900,395 L900,455" class="a"/><text x="930" y="430" class="sm">Yes</text><path d="M900,585 L900,690" class="a"/><text x="940" y="650" class="sm">Valid ID</text><path d="M900,825 L900,870" class="a"/><path d="M675,1060 L550,1060" class="a"/><text x="600" y="1040" class="sm">No</text><path d="M1125,1060 L1250,1060" class="a"/><text x="1170" y="1040" class="sm">Yes</text></svg>