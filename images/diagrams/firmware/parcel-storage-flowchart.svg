<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><style>.t{font:700 48px Arial;fill:#102A43}.s{font:22px Arial;fill:#486581}.b{font:700 20px Arial;fill:#102A43;text-anchor:middle}.sm{font:17px Arial;fill:#334E68;text-anchor:middle}.a{stroke:#5B6B7A;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#5B6B7A"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="70" y="75" class="t">Parcel Storage Flowchart</text><text x="70" y="115" class="s">Functions: same(), getFingerprintEnroll(), rotatemotor1/2(), turnOn()</text><rect x="690" y="150" width="420" height="100" rx="18" fill="#ECEFF4" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="188" class="b">same()</text><text x="900.0" y="220" class="sm">Receive assigned locker ID</text><polygon points="900,262.5 1110.0,330 900,397.5 690.0,330" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="337" class="b">Valid locker ID?</text><rect x="650" y="485" width="500" height="130" rx="18" fill="#8BCF7A" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="523" class="b">Enrol fingerprint</text><text x="900.0" y="555" class="sm">Capture first image</text><text x="900.0" y="580" class="sm">Capture same finger again</text><text x="900.0" y="605" class="sm">Create and store model</text><polygon points="900,622.5 1125.0,690 900,757.5 675.0,690" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="697" class="b">Fingerprint enrolment successful?</text><rect x="200" y="870" width="520" height="140" rx="18" fill="#F8B4B4" stroke="#AAB8C5" stroke-width="2"/><text x="460.0" y="908" class="b">Abort and secure locker</text><text x="460.0" y="940" class="sm">Show error</text><text x="460.0" y="965" class="sm">Deactivate motor</text><text x="460.0" y="990" class="sm">Set relay HIGH</text><rect x="1060" y="850" width="520" height="160" rx="18" fill="#4F8EF7" stroke="#AAB8C5" stroke-width="2"/><text x="1320.0" y="888" class="b">Close locker and start session</text><text x="1320.0" y="920" class="sm">Set relay HIGH</text><text x="1320.0" y="945" class="sm">Send locker state</text><text x="1320.0" y="970" class="sm">Set selected motor HIGH</text><text x="1320.0" y="995" class="sm">Call countdown timer</text><rect x="1060" y="1060" width="520" height="95" rx="18" fill="#F6A54C" stroke="#AAB8C5" stroke-width="2"/><text x="1320.0" y="1098" class="b">turnOn()</text><text x="1320.0" y="1130" class="sm">Display remaining shopping time</text><path d="M900,250 L900,262" class="a"/><path d="M900,397 L900,485" class="a"/><text x="930" y="450" class="sm">Yes</text><path d="M900,615 L900,622" class="a"/><path d="M675,690 L460,690 L460,870" class="a"/><text x="555" y="670" class="sm">No</text><path d="M1125,690 L1320,690 L1320,850" class="a"/><text x="1215" y="670" class="sm">Yes</text><path d="M1320,1010 L1320,1060" class="a"/></svg>