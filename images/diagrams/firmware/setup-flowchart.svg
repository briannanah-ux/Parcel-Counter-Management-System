<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><style>.t{font:700 48px Arial;fill:#102A43}.s{font:22px Arial;fill:#486581}.b{font:700 20px Arial;fill:#102A43;text-anchor:middle}.sm{font:17px Arial;fill:#334E68;text-anchor:middle}.a{stroke:#5B6B7A;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#5B6B7A"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="70" y="75" class="t">setup() Flowchart</text><text x="70" y="115" class="s">Actual Arduino initialisation sequence</text><rect x="690" y="170" width="420" height="95" rx="18" fill="#ECEFF4" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="208" class="b">Start setup()</text><rect x="690" y="310" width="420" height="120" rx="18" fill="#F6A54C" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="348" class="b">Start serial links</text><text x="900.0" y="380" class="sm">Serial: 9600 baud</text><text x="900.0" y="405" class="sm">NodeMCU: 115200 baud</text><rect x="690" y="475" width="420" height="125" rx="18" fill="#8BCF7A" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="513" class="b">Initialise fingerprint sensor</text><text x="900.0" y="545" class="sm">Read parameters and templates</text><text x="900.0" y="570" class="sm">Set sensor baud rate</text><rect x="690" y="645" width="420" height="115" rx="18" fill="#4F8EF7" stroke="#AAB8C5" stroke-width="2"/><text x="900.0" y="683" class="b">Initialise user interface</text><text x="900.0" y="715" class="sm">LCD welcome message</text><text x="900.0" y="740" class="sm">LEDs and buzzer outputs</text><polygon points="900,775.0 1120.0,845 900,915.0 680.0,845" fill="#FFD966" stroke="#AAB8C5" stroke-width="2"/><text x="900" y="852" class="b">Fingerprint password valid?</text><rect x="1190" y="970" width="400" height="110" rx="18" fill="#F8B4B4" stroke="#AAB8C5" stroke-width="2"/><text x="1390.0" y="1008" class="b">Stop execution</text><text x="1390.0" y="1040" class="sm">Remain in blocking loop</text><rect x="370" y="970" width="500" height="120" rx="18" fill="#B89CFF" stroke="#AAB8C5" stroke-width="2"/><text x="620.0" y="1008" class="b">Configure locker outputs</text><text x="620.0" y="1040" class="sm">Relay pins set as outputs</text><text x="620.0" y="1065" class="sm">Both relays initially HIGH</text><path d="M900,265 L900,310" class="a"/><path d="M900,430 L900,475" class="a"/><path d="M900,600 L900,645" class="a"/><path d="M900,760 L900,775" class="a"/><path d="M1120,845 L1390,845 L1390,970" class="a"/><text x="1260" y="825" class="sm">No</text><path d="M680,845 L620,845 L620,970" class="a"/><text x="585" y="825" class="sm">Yes</text></svg>