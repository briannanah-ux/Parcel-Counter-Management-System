<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <style>
    .title { font: 700 52px Arial, sans-serif; fill: #102A43; }
    .subtitle { font: 400 24px Arial, sans-serif; fill: #486581; }
    .box-title { font: 700 26px Arial, sans-serif; fill: #102A43; }
    .box-body { font: 400 20px Arial, sans-serif; fill: #486581; }
    .small { font: 400 18px Arial, sans-serif; fill: #486581; }
    .section { font: 700 22px Arial, sans-serif; fill: #102A43; letter-spacing: 1px; }
    .arrow { stroke: #5B6B7A; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    .connector { stroke: #5B6B7A; stroke-width: 4; fill: none; }
  </style>
  <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
    <path d="M0,0 L14,7 L0,14 z" fill="#5B6B7A"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="90" y="90" class="title">Hardware Block Diagram</text>
<text x="90" y="132" class="subtitle">Peripheral interfaces centred on the Arduino Mega 2560</text>
<rect x="690" y="340" width="540" height="300" rx="18" fill="#4F8EF7" stroke="#B8C7D9" stroke-width="2"/><text x="960.0" y="385" text-anchor="middle" class="box-title">Arduino Mega 2560</text><text x="960.0" y="420" text-anchor="middle" class="box-body">Main embedded controller</text><rect x="90" y="210" width="320" height="130" rx="18" fill="#8BCF7A" stroke="#B8C7D9" stroke-width="2"/><text x="250.0" y="255" text-anchor="middle" class="box-title">Fingerprint Sensor</text><text x="250.0" y="290" text-anchor="middle" class="box-body">Biometric interface</text><path d="M410,275.0 L550,275.0 L550,490 L690,490" class="arrow"/><rect x="90" y="390" width="320" height="130" rx="18" fill="#8BCF7A" stroke="#B8C7D9" stroke-width="2"/><text x="250.0" y="435" text-anchor="middle" class="box-title">RFID Reader</text><text x="250.0" y="470" text-anchor="middle" class="box-body">Session tracking</text><path d="M410,455.0 L550,455.0 L550,490 L690,490" class="arrow"/><rect x="90" y="570" width="320" height="130" rx="18" fill="#ECEFF4" stroke="#B8C7D9" stroke-width="2"/><text x="250.0" y="615" text-anchor="middle" class="box-title">Keypad</text><text x="250.0" y="650" text-anchor="middle" class="box-body">Locker selection</text><path d="M410,635.0 L550,635.0 L550,490 L690,490" class="arrow"/><rect x="90" y="750" width="320" height="130" rx="18" fill="#FDECEC" stroke="#B8C7D9" stroke-width="2"/><text x="250.0" y="795" text-anchor="middle" class="box-title">Power Supply</text><text x="250.0" y="830" text-anchor="middle" class="box-body">System power</text><path d="M410,815.0 L550,815.0 L550,490 L690,490" class="arrow"/><rect x="1510" y="140" width="320" height="130" rx="18" fill="#FFD966" stroke="#B8C7D9" stroke-width="2"/><text x="1670.0" y="185" text-anchor="middle" class="box-title">LCD Display</text><text x="1670.0" y="220" text-anchor="middle" class="box-body">User guidance</text><path d="M1230,490 L1380,490 L1380,205.0 L1510,205.0" class="arrow"/><rect x="1510" y="300" width="320" height="130" rx="18" fill="#FFD966" stroke="#B8C7D9" stroke-width="2"/><text x="1670.0" y="345" text-anchor="middle" class="box-title">Relay Module</text><text x="1670.0" y="380" text-anchor="middle" class="box-body">Locker control</text><path d="M1230,490 L1380,490 L1380,365.0 L1510,365.0" class="arrow"/><rect x="1510" y="460" width="320" height="130" rx="18" fill="#FFD966" stroke="#B8C7D9" stroke-width="2"/><text x="1670.0" y="505" text-anchor="middle" class="box-title">LED Indicators</text><text x="1670.0" y="540" text-anchor="middle" class="box-body">Session status</text><path d="M1230,490 L1380,490 L1380,525.0 L1510,525.0" class="arrow"/><rect x="1510" y="620" width="320" height="130" rx="18" fill="#FFD966" stroke="#B8C7D9" stroke-width="2"/><text x="1670.0" y="665" text-anchor="middle" class="box-title">Buzzer</text><text x="1670.0" y="700" text-anchor="middle" class="box-body">Audible feedback</text><path d="M1230,490 L1380,490 L1380,685.0 L1510,685.0" class="arrow"/><rect x="1510" y="780" width="320" height="130" rx="18" fill="#F6A54C" stroke="#B8C7D9" stroke-width="2"/><text x="1670.0" y="825" text-anchor="middle" class="box-title">ESP8266</text><text x="1670.0" y="860" text-anchor="middle" class="box-body">Wi-Fi communication</text><path d="M1230,490 L1380,490 L1380,845.0 L1510,845.0" class="arrow"/><text x="1830" y="1035" text-anchor="end" class="small">Diagram 5 of 6</text></svg>