<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<style>
.title{font:700 42px Arial;fill:#0b1f3a}
.subtitle{font:400 20px Arial;fill:#41536b}
.label{font:700 21px Arial;fill:#0b1f3a}
.small{font:400 16px Arial;fill:#25364d}
.box{stroke:#9fb3c8;stroke-width:2}
.arrow{stroke:#334e68;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#334e68"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="70" y="70" class="title">Firmware State Machine</text>
<text x="70" y="105" class="subtitle">Logical operating states based on the original workflow</text>
<rect x="560" y="140" width="280" height="100" rx="18" fill="#e5e7eb" class="box"/><text x="700.0" y="180" text-anchor="middle" class="label">BOOT</text><text x="700.0" y="212" text-anchor="middle" class="small">Initialise</text><rect x="560" y="290" width="280" height="110" rx="18" fill="#e8f5e9" class="box"/><text x="700.0" y="330" text-anchor="middle" class="label">READY</text><text x="700.0" y="362" text-anchor="middle" class="small">Wait for user</text><rect x="170" y="470" width="260" height="120" rx="18" fill="#dbeafe" class="box"/><text x="300.0" y="510" text-anchor="middle" class="label">REGISTER</text><text x="300.0" y="542" text-anchor="middle" class="small">Enrol fingerprint</text><rect x="970" y="470" width="260" height="120" rx="18" fill="#fff3e0" class="box"/><text x="1100.0" y="510" text-anchor="middle" class="label">VERIFY</text><text x="1100.0" y="542" text-anchor="middle" class="small">Check fingerprint</text><rect x="170" y="660" width="260" height="120" rx="18" fill="#fef3c7" class="box"/><text x="300.0" y="700" text-anchor="middle" class="label">STORE</text><text x="300.0" y="732" text-anchor="middle" class="small">Place parcel</text><rect x="970" y="660" width="260" height="120" rx="18" fill="#fef3c7" class="box"/><text x="1100.0" y="700" text-anchor="middle" class="label">COLLECT</text><text x="1100.0" y="732" text-anchor="middle" class="small">Retrieve parcel</text><rect x="560" y="690" width="280" height="100" rx="18" fill="#f3e8ff" class="box"/><text x="700.0" y="730" text-anchor="middle" class="label">RESET</text><text x="700.0" y="762" text-anchor="middle" class="small">End session</text><path d="M700,240 L700,290" class="arrow"/><path d="M560,345 L430,530" class="arrow"/><path d="M840,345 L970,530" class="arrow"/><path d="M300,590 L300,660" class="arrow"/><path d="M1100,590 L1100,660" class="arrow"/><path d="M430,720 L560,740" class="arrow"/><path d="M970,720 L840,740" class="arrow"/><path d="M700,690 L700,400" class="arrow"/></svg>